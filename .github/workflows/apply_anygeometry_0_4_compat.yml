name: Apply ANYgeometry 0.4 adapter compatibility

on:
  push:
    branches:
      - anygeometry_0_4_compatibility
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: anygeometry_0_4_compatibility
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: 069f22f3682ab97c89eb7824d53010c0b60dd575
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update adapter compatibility and CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{old!r} not found in {path}')
              file.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace('pyproject.toml', 'version = "0.5.2"', 'version = "0.5.3"')
          replace('pyproject.toml', 'geometry = ["ANYgeometry>=0.2.2,<0.3", "mapbox-earcut>=1.0,<2"]', 'geometry = ["ANYgeometry>=0.4.0,<0.5", "mapbox-earcut>=1.0,<2"]')
          replace('src/any3dview/__init__.py', '__version__ = "0.5.2"', '__version__ = "0.5.3"')
          replace('tests/test_core.py', 'any3dview.__version__ == "0.5.2"', 'any3dview.__version__ == "0.5.3"')
          replace('README.md', 'The optional adapter consumes ANYgeometry 0.2.2/schema 4 public records and', 'The optional adapter is qualified against ANYgeometry 0.4.0/schema 4 public records and')
          replace('src/any3dview/adapters/anygeometry/__init__.py', 'Optional ANYgeometry 0.2/schema-4 display adapter.', 'Optional ANYgeometry 0.4/schema-4 display adapter.')

          ci = Path('.github/workflows/ci.yml')
          ci.write_text('''name: Tests\n\non:\n  push:\n  pull_request:\n\npermissions:\n  contents: read\n\njobs:\n  test:\n    runs-on: ${{ matrix.os }}\n    strategy:\n      fail-fast: false\n      matrix:\n        os: [ubuntu-latest, windows-latest, macos-latest]\n        python-version: ["3.11", "3.12", "3.13", "3.14"]\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/checkout@v4\n        with:\n          repository: audunarn/ANYgeometry\n          ref: 069f22f3682ab97c89eb7824d53010c0b60dd575\n          path: .ecosystem/ANYgeometry\n          persist-credentials: false\n      - uses: actions/setup-python@v5\n        with:\n          python-version: ${{ matrix.python-version }}\n          cache: pip\n      - run: python -m pip install --upgrade pip\n      - run: python -m pip install -e ".ecosystem/ANYgeometry[planar]"\n      - run: python -m pip install -e ".[dev,geometry]"\n      - run: python -c "import anygeometry, any3dview; assert anygeometry.__version__.startswith('0.4.'); assert any3dview.__version__ == '0.5.3'"\n      - run: python -m pytest\n''', encoding='utf-8', newline='\n')
          PY
      - name: Qualify exact released geometry adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".ecosystem/ANYgeometry[planar]"
          python -m pip install -e ".[dev,geometry]"
          python -m pytest
      - name: Commit qualified adapter update
        shell: bash
        run: |
          rm -rf .ecosystem
          rm .github/workflows/apply_anygeometry_0_4_compat.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: qualify ANY3dView against ANYgeometry 0.4'
          git push origin HEAD:anygeometry_0_4_compatibility

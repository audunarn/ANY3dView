[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ANY3dView"
version = "0.5.5"
description = "Backend-neutral geometry, camera, shading, clipping and selection core for scientific 3D viewers"
readme = "README.md"
license = "MPL-2.0"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "src/any3dview/gpu/tkgl/license.terms",
]
authors = [
    { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["3d", "visualization", "mesh", "camera", "selection", "finite element"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]
gpu = ["moderngl>=5.12,<6", "Pillow>=10,<13"]
geometry = ["ANYgeometry>=0.4.0,<0.5", "mapbox-earcut>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/audunarn/ANY3dView"
Repository = "https://github.com/audunarn/ANY3dView"
Issues = "https://github.com/audunarn/ANY3dView/issues"

[project.gui-scripts]
any3dview-demo = "any3dview.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"any3dview.gpu" = [
    "tkgl/README",
    "tkgl/PROVENANCE.md",
    "tkgl/license.terms",
    "tkgl/darwin/Tkgl1.2.1/*",
    "tkgl/linux-aarch64/Tkgl1.2.1/*",
    "tkgl/linux-x86_64/Tkgl1.2.1/*",
    "tkgl/win32/TkGL1.2.1/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gui: opt-in test that creates a real Tk/OpenGL window",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ANY3dView"
version = "0.5.1"
description = "Backend-neutral geometry, camera, shading, clipping and selection core for scientific 3D viewers"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Audun Arnesen Nyhus", email = "audunarn@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["3d", "visualization", "mesh", "camera", "selection", "finite element"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]
gpu = ["moderngl>=5.12,<6", "tkinter-gl>=1.1,<2", "Pillow>=10,<13"]
geometry = ["ANYgeometry>=0.2.2,<0.3", "mapbox-earcut>=1.0,<2"]

[project.urls]
Homepage = "https://github.com/audunarn/ANY3dView"
Repository = "https://github.com/audunarn/ANY3dView"
Issues = "https://github.com/audunarn/ANY3dView/issues"

[project.gui-scripts]
any3dview-demo = "any3dview.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "gui: opt-in test that creates a real Tk/OpenGL window",
]

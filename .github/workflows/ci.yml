name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: audunarn/ANYgeometry
          ref: 069f22f3682ab97c89eb7824d53010c0b60dd575
          path: .ecosystem/ANYgeometry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".ecosystem/ANYgeometry[planar]"
      - run: python -m pip install -e ".[dev,geometry]"
      - run: python -c "import anygeometry, any3dview; assert anygeometry.__version__.startswith('0.4.'); assert any3dview.__version__ == '0.5.3'"
      - run: python -m pytest
